background {
    monitor =
    path = /home/dallas/.config/hypr/walls/lock/lock.image
}

input-field {
    monitor =
    size = 300, 60
    position = 0, -120

    outline_thickness = 2

    outer_color = rgb(cdd6f4)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgb(cdd6f4)

    rounding = 12

    fade_on_empty = false
    dots_center = true
    placeholder_text = Password...
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 96
    position = 0, 150
}
